[greeter]
# Fondo y fuente
background = #0a0c0e
font-name = Hack Nerd Font 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb

# Indicadores superiores (Barra estilo statusbar)
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = 󰅐 %H:%M:%S  |  󰃭 %A, %d %B

# Posicionamiento de la caja central
position = 50%,center 50%,center
default-user-image = #user
user-background = false

# Tema CSS que crearemos en el paso 3
theme-name = TNPUNK
