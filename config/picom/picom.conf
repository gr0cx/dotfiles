#  ██╔══██╗██║██╔════╝██╔═══██╗████╗ ████║  Toxic Cyberpunk Edition
#  ██████╔╝██║██║     ██║   ██║██╔████╔██║  Optimized for Intel iGPU
#  ██╔═══╝ ██║██║     ██║   ██║██║╚██╔╝██║
#  ██║     ██║╚██████╗╚██████╔╝██║ ╚═╝ ██║
#  ╚═╝     ╚═╝ ╚═════╝ ╚═════╝ ╚═╝     ╚═╝

## ----- CyberGlow ----- ##

shadow = true;

shadow-radius = 16;
shadow-opacity = 0.55;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#00FF66";

## ----- Fading ----- ##

fading = true;

fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = false;

## ----- Transparency ----- ##

frame-opacity = 1.0;

## ----- Corners ----- ##

corner-radius = 6;

#################################
#    Intel iGPU Optimization    #
#################################

backend = "glx";
vsync = true;

# Specific Intel config #
use-damage = true;
unredir-if-possible = false;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

#################################
#             Blur              #
#################################

blur-background = false;

#################################
#             Rules             #
#################################

rules: (

	{
		blur-background = false;
		fade = true;
	},

	{
		match = "window_type = 'normal'";
		fade = true;
		shadow = true;
	},

	{
		match = "window_type = 'dialog'";
		shadow = true;
	},

	{
		match = "window_type = 'tooltip'";
		corner-radius = 0;
		opacity = 0.90;
	},

    {
		match = "fullscreen";
		corner-radius = 0;
		shadow = false;
	},

	{
		match = "window_type = 'dock'";
		corner-radius = 0;
		fade = true;
		shadow = false;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
		corner-radius = 0;
		shadow = false;
	},

	{
        match = "name = 'Eww - notif-toast-window' || name = 'notif-toast-window'";
        fade = true;
        shadow = true;
    },

	{
		match = "class_g = 'Alacritty' || class_g = 'st-256color' || class_g = 'kitty' || class_g = 'FloaTerm'";
		opacity = 1.0;
	},

	{
		match = "class_g = 'Polybar'	  || "
				"class_g = 'eww-bar'	  || "
				"class_g = 'Eww'          || "
				"class_g = 'Viewnior'	  || "
				"class_g = 'Rofi'		  || "
				"class_g = 'mpv'		  || "
				"class_g = 'retroarch'    || "
				"class_g = 'Xsecurelock'  || "
		corner-radius = 0;
		shadow = false;
	},

@include "picom-animations.conf"
)
