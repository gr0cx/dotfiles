# ==============================================================================
# CYBERPUNK ANIMATIONS
# ==============================================================================

# --- NORMAL WINDOWS ---
{
	match = "window_type = 'normal'";
	animations = (
		# Window Close
		{
			triggers = ["close"];
			opacity = {
				curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
				duration = 0.40;
				start = "window-raw-opacity-before";
				end = 0;
			};
			scale-x = {
				curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
				duration = 0.40;
				start = 1;
				end = 0.70;
			};
			scale-y = "scale-x";
			offset-x = "(1 - scale-x) / 2 * window-width";
			offset-y = "(1 - scale-y) / 2 * window-height";

			shadow-opacity = "opacity";
			shadow-scale-x = "scale-x";
			shadow-scale-y = "scale-y";
			shadow-offset-x = "offset-x";
			shadow-offset-y = "offset-y";
		},

		# Window Open
		{
			triggers = ["open"];
			opacity = {
				curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
				duration = 0.45;
				start = 0;
				end = "window-raw-opacity";
			};
			scale-x = {
				curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)";
				duration = 0.45;
				start = 0.70;
				end = 1;
			};
			scale-y = "scale-x";
			offset-x = "(1 - scale-x) / 2 * window-width";
			offset-y = "(1 - scale-y) / 2 * window-height";

			shadow-opacity = "opacity";
			shadow-scale-x = "scale-x";
			shadow-scale-y = "scale-y";
			shadow-offset-x = "offset-x";
			shadow-offset-y = "offset-y";
		},

		# Elastic resize / BSPWM Movement
		{
			triggers = ["geometry"];
			scale-x = {
				curve = "cubic-bezier(0.1, 0.8, 0.1, 1.0)";
				duration = 0.35;
				start = "window-width-before / window-width";
				end = 1;
			};
			scale-y = {
				curve = "cubic-bezier(0.1, 0.8, 0.1, 1.0)";
				duration = 0.35;
				start = "window-height-before / window-height";
				end = 1;
			};
			offset-x = {
				curve = "cubic-bezier(0.1, 0.8, 0.1, 1.0)";
				duration = 0.35;
				start = "window-x-before - window-x";
				end = 0;
			};
			offset-y = {
				curve = "cubic-bezier(0.1, 0.8, 0.1, 1.0)";
				duration = 0.35;
				start = "window-y-before - window-y";
				end = 0;
			};

			shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";
            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
		}
	)
},

# --- ROFI LAUNCHER ---
{
	match = "class_g = 'Rofi'";
	animations = (
		{
			triggers = ["close", "hide"];
			preset = "disappear";
			duration = 0.20;
			scale = 0.80;
		},
		{
			triggers = ["open", "show"];
			preset = "appear";
			duration = 0.30;
			scale = 0.80;
		}
	)
},

# --- SCRATCHPAD ---
{
	match = "class_g = 'bspwm-scratch'";
	animations = (
		{
			triggers = ["close", "hide"];
			preset = "fly-out";
			direction = "up";
			duration = 0.15;
		},
		{
			triggers = ["open", "show"];
			preset = "fly-in";
			direction = "up";
			duration = 0.15;
		}
	)
},

# --- NOTIFICATIONS ---
{
	match = "name = 'Eww - notif-toast-window' || name = 'notif-toast-window' || class_i = 'notif-toast-window'";
	animations = (
		{
			triggers = ["open", "show"];
			opacity = {
				curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
				duration = 0.30;
				start = 0;
				end = "window-raw-opacity";
			};
			offset-x = {
				curve = "cubic-bezier(0.34, 1.56, 0.64, 1.0)";
				duration = 0.40;
				start = 100;
				end = 0;
			};
		},
		{
			triggers = ["close", "hide"];
			opacity = {
				curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
				duration = 0.30;
				start = "window-raw-opacity-before";
				end = 0;
			};
			offset-x = {
				curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
				duration = 0.30;
				start = 0;
				end = 100;
			};
		}
	)
}